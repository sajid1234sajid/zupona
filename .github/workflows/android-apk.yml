# Builds the two installable Android apps on a GitHub runner and publishes
# them as release assets, so the newest APKs always sit at
#
#   https://github.com/<owner>/<repo>/releases/latest/download/zupona.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/zupona-admin.apk
#
# Both are Trusted Web Activities -- the shop around zupona.com, the panel
# around admin.zupona.com -- and differ only by the configuration in their own
# twa-manifest.json; see android/README.md. Nothing here needs an Android SDK
# on a laptop; the runner has one.
name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Only the things the APKs are actually made of. Ordinary site changes
    # reach both apps the moment they deploy, so rebuilding for them would
    # publish a release nobody needs to install.
    paths:
      - android/twa-manifest.json
      - android/admin/twa-manifest.json
      - .github/workflows/android-apk.yml
      - public/manifest.webmanifest
      - public/admin.webmanifest
      - public/icon-*.png
      - public/admin-icon-*.png
      - public/shortcut-*.png

permissions:
  contents: write
  # For asking the deploy workflow to run after the fingerprint is committed.
  actions: write

concurrency:
  group: android-apk
  cancel-in-progress: false

env:
  # The account the Worker deploys to, and the private R2 bucket the app's
  # signing key is kept in. Nothing binds that bucket, so no route can serve it.
  CF_ACCOUNT: 14743b3b6de704c99ed06b7b67c65903
  VAULT_BUCKET: zupona-app-signing
  VAULT_OBJECT: android-keystore.json

jobs:
  apk:
    name: ${{ matrix.app.title }}
    runs-on: ubuntu-latest
    strategy:
      # One at a time, not for speed but for correctness: the first run of all
      # creates the signing key, and two jobs creating it at once would leave
      # two apps signed by different certificates and one of them overwritten
      # in the vault. Running in order also means only one job ever commits a
      # new fingerprint, so there is no push to rebase onto.
      max-parallel: 1
      # An app that fails to build should not take the other one's release
      # down with it.
      fail-fast: false
      matrix:
        app:
          - id: shop
            title: Zupona app
            dir: android
            host: zupona.com
            apk: zupona.apk
            artwork: icon-512.png icon-maskable-512.png shortcut-categories.png shortcut-offers.png shortcut-cart.png
          - id: admin
            title: Zupona Admin app
            dir: android/admin
            host: admin.zupona.com
            apk: zupona-admin.apk
            artwork: admin-icon-512.png admin-icon-maskable-512.png shortcut-admin-orders.png shortcut-admin-products.png shortcut-admin-new-product.png
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, because the fingerprint step rebases onto main before
          # pushing and a shallow clone makes that awkward.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Bubblewrap downloads the launcher icon, the shortcut icons and the
      # splash screen from the live site, so a push that changes them has to
      # reach Cloudflare first.
      #
      # The wait compares content, not existence. Checking only that a file
      # answers 200 lets a build that starts before the deploy finishes pick up
      # the previous artwork and ship an app wearing last week's logo, which is
      # exactly what happened to 1.0.4.
      - name: Wait for the site to serve this commit's artwork
        env:
          HOST: ${{ matrix.app.host }}
          ARTWORK: ${{ matrix.app.artwork }}
        run: |
          set -u
          artwork="$ARTWORK"

          hash_of() {
            node -e '
              const crypto = require("crypto");
              const fs = require("fs");
              console.log(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"));
            ' "$1"
          }

          for attempt in $(seq 1 24); do
            waiting_on=""
            for file in $artwork; do
              if ! curl -fsS "https://$HOST/$file" -o "$RUNNER_TEMP/live-$file"; then
                waiting_on="$file (not served yet)"
                break
              fi
              if [ "$(hash_of "public/$file")" != "$(hash_of "$RUNNER_TEMP/live-$file")" ]; then
                waiting_on="$file (the site still has the previous copy)"
                break
              fi
            done

            if [ -z "$waiting_on" ]; then
              echo "The site is serving this commit's artwork."
              exit 0
            fi
            echo "Attempt $attempt: waiting on $waiting_on"
            sleep 15
          done

          echo "::error::$HOST is still not serving this commit's artwork, so the APK would be built from the previous icons."
          exit 1

      - name: Point Bubblewrap at the runner's JDK and Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli@latest

      # Bubblewrap can install the build-tools itself, but it looks for
      # sdkmanager under `tools/bin` or `bin`, and the runner's SDK keeps it in
      # `cmdline-tools/latest/bin` -- so left alone it fails before Gradle ever
      # starts. Installing the exact version it asks for means the check it
      # runs first passes and it never goes looking.
      - name: Install the Android build tools Bubblewrap expects
        run: |
          set -e
          build_tools=$(node -e '
            const { execSync } = require("child_process");
            const root = execSync("npm root -g").toString().trim();
            const candidates = [
              root + "/@bubblewrap/cli/node_modules/@bubblewrap/core",
              root + "/@bubblewrap/core",
            ];
            for (const candidate of candidates) {
              try {
                const sdk = require(candidate + "/dist/lib/androidSdk/AndroidSdkTools.js");
                console.log(sdk.BUILD_TOOLS_VERSION);
                process.exit(0);
              } catch {}
            }
            process.exit(1);
          ')
          platform="${build_tools%%.*}"
          echo "Bubblewrap wants build-tools;$build_tools, so platforms;android-$platform too."

          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -1)
          fi
          echo "Using $sdkmanager"

          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platform-tools" "platforms;android-$platform" "build-tools;$build_tools"
          ls "$sdk/build-tools"

          # Bubblewrap calls an SDK without a `tools` or a `bin` directory
          # invalid and refuses to start, and a modern SDK has neither -- its
          # command line tools live under `cmdline-tools/latest/bin`. Pointing
          # `bin` at them satisfies the check with the real tools.
          if [ ! -e "$sdk/bin" ] && [ ! -e "$sdk/tools" ]; then
            tools_bin=$(dirname "$sdkmanager")
            ln -s "$tools_bin" "$sdk/bin" 2>/dev/null || sudo ln -s "$tools_bin" "$sdk/bin"
            echo "Linked $sdk/bin -> $tools_bin"
          fi

      # Where the signing key lives, and why it is not in this repository.
      #
      # Android installs an update only over an app signed by the same key, so
      # a key generated per build would make every release a fresh install --
      # uninstall, lose the session, start again. The key therefore has to
      # outlive the run that made it, and a public repository is no place for
      # one. It is kept in a private R2 bucket instead, reached with the
      # Cloudflare token this repository already holds in order to deploy, so
      # the app needs no new credential of its own. Nothing in the Worker binds
      # that bucket, so no route can hand the key out the way /api/media hands
      # out everything in the media bucket.
      #
      # KV would have been the obvious home and was tried first. Its free plan
      # allows a thousand writes a day and the shop's own caching spends them,
      # so the write that saves the key was refused with a quota error. R2's
      # limits are monthly and nowhere near.
      #
      # Repository secrets win if they are ever set, which is the migration
      # path to a keystore held somewhere else.
      - name: Fetch or create the app signing key
        id: signing
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -u
          work="$RUNNER_TEMP/signing"
          mkdir -p "$work"
          # Beside the twa-manifest.json being built, which names it as
          # `./android.keystore`. Both apps are signed with the same key, so
          # both get the same copy of it.
          keystore="$GITHUB_WORKSPACE/${{ matrix.app.dir }}/android.keystore"

          buckets="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets"
          vault="$buckets/$VAULT_BUCKET/objects/$VAULT_OBJECT"

          alias_name="${KEY_ALIAS:-zupona}"
          stable=true

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            origin="repository secrets"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            store_password="$KEYSTORE_PASSWORD"
            key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          elif [ -z "${CF_TOKEN:-}" ]; then
            origin="a throwaway key (no Cloudflare token to reach the vault)"
            stable=false
          else
            # The status is read rather than trusted to curl's exit code, so a
            # refusal can be told apart from a key that simply is not there
            # yet, and so Cloudflare's own message reaches the run summary.
            vault_status=$(curl -s -o "$work/vault.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_TOKEN" "$vault")
            case "$vault_status" in
              200)
                origin="the R2 vault"
                node -e '
                  const fs = require("fs");
                  const work = process.argv[1];
                  const vault = JSON.parse(fs.readFileSync(work + "/vault.json", "utf8"));
                  fs.writeFileSync(work + "/keystore.b64", vault.keystore);
                  fs.writeFileSync(work + "/password", vault.password);
                  fs.writeFileSync(work + "/alias", vault.alias || "zupona");
                ' "$work"
                base64 -d < "$work/keystore.b64" > "$keystore"
                store_password=$(cat "$work/password")
                key_password="$store_password"
                alias_name=$(cat "$work/alias")
                ;;
              404)
                # Either the object or the bucket is missing; both mean there
                # is no key yet, and the write below creates whichever it is.
                origin="a new key, now saved to the R2 vault"
                ;;
              *)
                echo "::warning title=The vault could not be read::HTTP $vault_status from Cloudflare: $(head -c 300 "$work/vault.json" | tr -d '\n')"
                origin="a throwaway key (the vault could not be read)"
                stable=false
                ;;
            esac
          fi

          if [ "${store_password:-}" = "" ]; then
            # Either a brand new key, or no vault to keep one in.
            store_password=$(openssl rand -hex 24)
            key_password="$store_password"
            keytool -genkeypair -noprompt \
              -keystore "$keystore" -alias "$alias_name" \
              -storepass "$store_password" -keypass "$key_password" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Zupona, O=Zupona, L=Dhaka, C=BD"

            if [ "$stable" = "true" ]; then
              node -e '
                const fs = require("fs");
                // argv[0] is node itself; `node -e` has no script name.
                const [, work, keystore, password, alias] = process.argv;
                const vault = {
                  keystore: fs.readFileSync(keystore).toString("base64"),
                  password,
                  alias,
                  createdAt: new Date().toISOString(),
                };
                fs.writeFileSync(work + "/upload.json", JSON.stringify(vault));
              ' "$work" "$keystore" "$store_password" "$alias_name"

              # Creating the bucket is idempotent enough: an existing one comes
              # back as an error naming itself, which is not a failure here.
              create_status=$(curl -s -o "$work/bucket.json" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$VAULT_BUCKET\"}" "$buckets")
              echo "Bucket create returned HTTP $create_status."

              put_status=$(curl -s -o "$work/put.json" -w '%{http_code}' -X PUT \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary "@$work/upload.json" "$vault")
              if [ "$put_status" = "200" ]; then
                echo "Saved the new signing key to the R2 vault."
              else
                echo "::warning title=The signing key could not be saved::HTTP $put_status from Cloudflare: $(head -c 300 "$work/put.json" | tr -d '\n')"
                echo "::warning::Bucket creation said: $(head -c 300 "$work/bucket.json" | tr -d '\n')"
                stable=false
                origin="a throwaway key (saving to the vault failed)"
              fi
            fi
          fi

          # Never let either password reach a log, including through a tool
          # that echoes its own arguments.
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"

          # An account collects near-identical token names, and the value is a
          # secret so it cannot be compared against anything. The id is not a
          # secret, and it is what the dashboard's edit page is keyed by, so a
          # refusal says which token to go and widen.
          if [ "$stable" != "true" ] && [ -n "${CF_TOKEN:-}" ]; then
            token_id=$(curl -sS -H "Authorization: Bearer $CF_TOKEN" \
                         https://api.cloudflare.com/client/v4/user/tokens/verify \
                       | grep -o '"id":"[a-f0-9]\{32\}"' | head -1 | cut -d'"' -f4)
            if [ -n "$token_id" ]; then
              echo "::notice::The vault needs Workers R2 Storage:Edit. This run used token $token_id - https://dash.cloudflare.com/profile/api-tokens/$token_id"
            fi
          fi

          echo "Signing with $origin, alias $alias_name."
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          echo "alias_name=$alias_name" >> "$GITHUB_OUTPUT"
          # Bubblewrap reads both of these instead of prompting, which it
          # cannot do on a runner with no terminal attached.
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$store_password" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$key_password" >> "$GITHUB_ENV"

      - name: Stamp the version
        env:
          KEY_ALIAS: ${{ steps.signing.outputs.alias_name }}
          APP_DIR: ${{ matrix.app.dir }}
        run: |
          node -e '
            const fs = require("fs");
            const file = process.env.APP_DIR + "/twa-manifest.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const build = Number(process.env.GITHUB_RUN_NUMBER);
            manifest.appVersionCode = build;
            manifest.appVersionName = "1.0." + build;
            manifest.appVersion = manifest.appVersionName;
            manifest.signingKey.alias = process.env.KEY_ALIAS;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
            console.log("Building version", manifest.appVersionName);
          '

      # The output is captured so that a failure can be put into an annotation.
      # A runner's logs need an authenticated session to read; annotations do
      # not, which is the difference between diagnosing a broken build and
      # guessing at it.
      - name: Build the APK
        run: |
          cd "${{ matrix.app.dir }}"
          status=0
          {
            bubblewrap update --skipVersionUpgrade < /dev/null
            bubblewrap build --skipPwaValidation < /dev/null
          } > build.log 2>&1 || status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            printf '::error title=Bubblewrap build failed::%s\n' \
              "$(tail -n 60 build.log | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit "$status"
          fi
          ls -l ./*.apk

      - name: Read the signing fingerprint
        id: fingerprint
        run: |
          cd "${{ matrix.app.dir }}"
          sha256=$(keytool -list -v -keystore android.keystore -alias "${{ steps.signing.outputs.alias_name }}" -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d '[:space:]')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: $sha256"

      # What removes Chrome's address bar from the installed app: the site
      # states, at /.well-known/assetlinks.json, that it trusts an app signed
      # by this certificate. Writing it here rather than committing it means
      # the statement is made by the build that actually signed the APK.
      #
      # Older fingerprints are kept alongside the current one so that a phone
      # still running a previously signed build keeps its full-screen app.
      # The statement is committed rather than stored in KV, because the deploy
      # that publishes it is free and reliable where a KV write is neither.
      # Nothing here is secret: a signing certificate's fingerprint is meant to
      # be published.
      #
      # It only commits when the certificate is one the file does not already
      # name, which after the first stable build means never.
      #
      # Only the shop's job does this, though the statement covers both apps:
      # one keystore signs both, so both fingerprints are the same one, and
      # letting the second job commit it too would mean a push to rebase onto
      # for no new information. `src/app/api/assetlinks/route.ts` names the
      # right application id per host from this one list.
      - name: Vouch for the certificate that signed this build
        if: steps.signing.outputs.stable == 'true' && matrix.app.id == 'shop'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.fingerprint.outputs.sha256 }}
        run: |
          set -eu
          file="src/lib/androidSigning.ts"

          if grep -q "$SHA256" "$file"; then
            echo "The site already vouches for this certificate."
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const source = fs.readFileSync(file, "utf8");
            const quoted = source.match(/"[0-9A-F]{2}(?::[0-9A-F]{2}){31}"/g) || [];
            const known = quoted.map((entry) => entry.slice(1, -1));
            // Newest first, and at most three: a rotation needs the previous
            // fingerprint until every phone has the new build, and no longer.
            const merged = [process.env.SHA256, ...known.filter((f) => f !== process.env.SHA256)]
              .slice(0, 3);
            const body = merged.map((f) => `\n  "${f}",`).join("") + "\n";
            const replaced = source.replace(
              /export const ANDROID_CERT_FINGERPRINTS: string\[\] = \[[^\]]*\];/,
              `export const ANDROID_CERT_FINGERPRINTS: string[] = [${body}];`
            );
            if (replaced === source) throw new Error("the fingerprint list was not found in " + file);
            fs.writeFileSync(file, replaced);
            console.log("Vouching for", merged.length, "certificate(s).");
          ' "$file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          # Two -m flags rather than a heredoc: inside a YAML block the heredoc
          # body cannot start at column zero, and its indentation would end up
          # in the commit message.
          git commit \
            -m "Vouch for the certificate signing the Android app" \
            -m "Written by the APK build for version 1.0.${{ github.run_number }}. Chrome hides its address bar inside the installed app only once the site names the certificate the APK was signed with."
          git pull --rebase origin main
          git push origin HEAD:main

          # A push made with GITHUB_TOKEN deliberately starts no workflows, so
          # the deploy that would publish this has to be asked for by name --
          # otherwise the statement sits in the repository, true and unserved.
          gh workflow run "Deploy to Cloudflare" --ref main
          echo "Asked for a deploy so the site starts serving it."

      # Both APKs go into one release rather than one release each, because
      # GitHub's "latest" is a single release: publishing them separately would
      # make whichever finished second the latest one and start 404ing the
      # other app's /releases/latest/download/ link. The first job to get here
      # creates the release; the second adds its APK to it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: app-v1.0.${{ github.run_number }}
        run: |
          apk=$(ls "${{ matrix.app.dir }}"/*.apk | head -1)
          cp "$apk" "${{ matrix.app.apk }}"
          {
            echo "The Zupona shop and its admin panel, as installable Android apps."
            echo
            echo "**Install:** download an APK below on an Android phone and open it."
            echo "Android asks permission to install from this source the first time."
            echo
            echo "- \`zupona.apk\` — the shop, opening zupona.com full-screen."
            echo "- \`zupona-admin.apk\` — the admin panel, opening admin.zupona.com."
            echo "  It asks for the usual admin sign-in; install it only on a phone that should be running the store."
            echo
            echo "Neither needs updating when the site changes: they are the site, full-screen."
            echo
            echo "Signed with ${{ steps.signing.outputs.origin }}."
            echo "Certificate SHA-256: \`${{ steps.fingerprint.outputs.sha256 }}\`"
            if [ "${{ steps.signing.outputs.stable }}" != "true" ]; then
              echo
              echo "> Signed with a per-build key. To move to a later version, uninstall this one first."
            fi
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ matrix.app.apk }}" --clobber
          else
            gh release create "$TAG" "${{ matrix.app.apk }}" \
              --title "Zupona apps 1.0.${{ github.run_number }}" \
              --notes-file notes.md
          fi

      - name: Summarise the build
        if: always()
        run: |
          {
            echo "### ${{ matrix.app.title }} 1.0.${{ github.run_number }}"
            echo
            echo "- Signing key: ${{ steps.signing.outputs.origin }}"
            echo "- Updates install in place: ${{ steps.signing.outputs.stable }}"
            echo "- Certificate SHA-256: \`${{ steps.fingerprint.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: zupona-${{ matrix.app.id }}-apk
          path: ${{ matrix.app.dir }}/*.apk
          if-no-files-found: ignore
