# Applies one migration file to the *remote* D1 database, by hand.
#
# CI deploys code only, on purpose: a migration that rode along with every
# push would run against production the moment someone merged a branch, and
# the order that keeps zupona.com working is migration first, deploy second --
# a judgement call that belongs to a person, not to a push trigger.
#
# This is that person's lever. It never fires on its own; someone chooses the
# file and presses the button. GitHub's runners can reach Cloudflare, which is
# the whole reason it exists -- it needs no local machine and no wrangler login.
name: Apply D1 migration

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Migration file in db/migrations (e.g. 0017_sms_gateway.sql)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One migration at a time. Two running together against the same database is
  # how you get half an ALTER.
  group: d1-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The input names a file to run against production, so it is checked
      # rather than trusted: the pattern rules out a path (no slashes, no `..`)
      # and the existence test rules out a typo that would otherwise fail
      # halfway through wrangler with a less obvious message.
      # The input reaches the shell as an environment variable, never spliced
      # into the script text: `${{ }}` is substituted before bash ever sees the
      # line, so a value containing a quote would be running as script rather
      # than being tested as data.
      - name: Check the file
        env:
          INPUT_FILE: ${{ inputs.file }}
        run: |
          FILE="$INPUT_FILE"
          if ! printf '%s' "$FILE" | grep -Eq '^[0-9]{4}_[a-z0-9_]+\.sql$'; then
            echo "::error::'$FILE' is not a migration filename like 0017_sms_gateway.sql"
            exit 1
          fi
          if [ ! -f "db/migrations/$FILE" ]; then
            echo "::error::db/migrations/$FILE does not exist on this branch"
            exit 1
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Fail early without credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Neither CLOUDFLARE_D1_TOKEN nor CLOUDFLARE_API_TOKEN is set as a repository secret."
            exit 1
          fi

      # An account collects near-identical token names over the years, and
      # nothing in the list says which one a workflow is holding -- the value
      # is a secret, so you cannot compare it against anything. Its id is not a
      # secret, though, and the dashboard's edit page for a token is that id in
      # the URL. So the run names the token it actually used, and nobody has to
      # guess which of six "build token" rows to change.
      - name: Say which token this is
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ID=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 https://api.cloudflare.com/client/v4/user/tokens/verify \
               | grep -o '"id":"[a-f0-9]\{32\}"' | head -1 | cut -d'"' -f4)
          if [ -n "$ID" ]; then
            echo "::notice::This run is using token $ID - open https://dash.cloudflare.com/profile/api-tokens/$ID to edit exactly this one."
          else
            echo "::notice::Could not read the token id (an account-owned token cannot be verified this way)."
          fi

      # Prefers CLOUDFLARE_D1_TOKEN and falls back to the deploy token, because
      # the two jobs need different permissions and should not be forced to
      # share one credential. Cloudflare's "Edit Cloudflare Workers" template
      # predates D1 and does not include it, so a token that deploys perfectly
      # well answers `Authentication error [code: 10000]` here -- and widening
      # the deploy token is not the only fix, nor the narrowest one, since D1
      # Edit cannot be scoped to a single database.
      - name: Apply to the remote database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 14743b3b6de704c99ed06b7b67c65903
        run: |
          if ! npx wrangler d1 execute zupona-v3-db --remote --file="./db/migrations/$FILE" --yes; then
            echo "::error::Migration failed. If the message above is 'Authentication error [code: 10000]', the token in use can deploy Workers but cannot write to D1. Either create a token whose only permission is Account > D1 > Edit and add it as the repository secret CLOUDFLARE_D1_TOKEN (this workflow prefers it and leaves the deploy token alone), or run the migration from a machine whose wrangler is logged in: npx wrangler d1 execute zupona-v3-db --remote --file=./db/migrations/<file>.sql"
            exit 1
          fi
