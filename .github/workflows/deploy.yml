# Builds the Worker on every push to main and deploys it to Cloudflare.
#
# The deploy half only runs once CLOUDFLARE_API_TOKEN exists as a repository
# secret; until then the job still builds, so a broken commit is caught here
# rather than on zupona.com. Cloudflare's own Workers Builds integration would
# do the same thing, but connecting that requires a browser sign-in.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # vinext writes its own wrangler config during the build; deploying with
      # plain `wrangler deploy` against the root wrangler.jsonc would ship a
      # broken Worker, so the generated config is what gets deployed.
      - id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set - built only, nothing deployed."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        run: npx vinext-cloudflare deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 14743b3b6de704c99ed06b7b67c65903
