# Pushes Worker secrets to Cloudflare from repository secrets.
#
# A Worker secret is not in the repository and not in wrangler.jsonc -- it is
# set once against the deployed Worker and survives every later deploy. Doing
# that normally means `wrangler secret put` from a machine that is logged in to
# Cloudflare. This does it from a runner instead, so the value travels from
# GitHub's secret store straight to Cloudflare and is never typed into a
# terminal, a chat window or a file.
#
# Add the value under Settings -> Secrets and variables -> Actions, then run
# this workflow. Repeat whenever a key is rotated: `secret put` overwrites.
name: Sync Worker secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Fail early without credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set as a repository secret."
            exit 1
          fi

      # Each value is piped in, never passed as an argument: an argument shows
      # up in the process list and in wrangler's own error output, and a secret
      # that reaches a log has stopped being a secret. A repository secret that
      # is not set is skipped rather than written as an empty string, which the
      # app reads as "no gateway configured" and would be worse than absent.
      - name: Put the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 14743b3b6de704c99ed06b7b67c65903
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          put() {
            local name="$1"
            local value="${!name-}"
            if [ -z "$value" ]; then
              echo "::notice::$name is not set as a repository secret - skipped."
              return
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --name zupona
            echo "::notice::$name written to the Worker."
          }
          put SMS_API_KEY
          put SMS_PROVIDER
          put SMS_SENDER_ID
          put GOOGLE_CLIENT_ID
          put GOOGLE_CLIENT_SECRET
